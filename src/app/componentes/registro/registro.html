<main>
  <div class="titulo"><h1>¡Registrate para obtener beneficios exclusivos!</h1></div>
  <section class="registro">
    <form [formGroup]="formularioRegistro" (ngSubmit)="registrarUsuario()">
      <label>Correo electrónico: <input type="email" formControlName="correo_electronico"></label>
      <label>Nombre: <input type="text" formControlName="nombre"></label>
      <label>Apellido: <input type="text" formControlName="apellido"></label>
      <label>Fecha de nacimiento: <input type="date" class="fecha" formControlName="fecha_nacimiento"></label>
      <label>Tipo de sangre:
        <select formControlName="tipo_sangre">
          <option value="0-">O-</option>
          <option value="0+">O+</option>
          <option value="A-">A-</option>
          <option value="A+">A+</option>
          <option value="B-">B-</option>
          <option value="B+">B+</option>
          <option value="AB-">AB-</option>
          <option value="AB+">AB+</option>
        </select>
      </label>
      <label>Color de ojos:
        <select formControlName="color_ojos">
          <option value="Negro">Negro</option>
          <option value="Marrón">Marrón</option>
          <option value="Ámbar">Ámbar</option>
          <option value="Avellana">Avellana</option>
          <option value="Verde">Verde</option>
          <option value="Azul">Azul</option>
          <option value="Gris">Gris</option>
          <option value="Violeta">Violeta</option>
          <option value="Rojo">Rojo</option>
        </select>
      </label>
      <label>Días de vacaciones por año: <input type="number" formControlName="dias_vacaciones_anuales"></label>
      <button type="submit">Registrarse</button>
    </form>
  </section>
</main>

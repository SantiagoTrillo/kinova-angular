<form [formGroup]="formularioRegistro" (ngSubmit)="registrarUsuario()">
  <label>Correo electrónico: <input type="email" formControlName="correoElectronico"></label>
  <label>Nombre: <input type="text" formControlName="nombre"></label>
  <label>Apellido: <input type="text" formControlName="apellido"></label>
  <label>Fecha de nacimiento: <input type="date" class="fecha" formControlName="fechaNacimiento"></label>
  <label>Tipo de sangre:
    <select formControlName="tipoSangre">
      <option value="oNegativo">O-</option>
      <option value="oPositivo">O+</option>
      <option value="aNegativo">A-</option>
      <option value="aPositivo">A+</option>
      <option value="bNegativo">B-</option>
      <option value="bPositivo">B+</option>
      <option value="aBNegativo">AB-</option>
      <option value="aBPositivo">AB+</option>
    </select>
  </label>
  <label>Color de ojos:
    <select formControlName="colorOjos">
      <option value="negro">Negro</option>
      <option value="marron">Marrón</option>
      <option value="ambar">Ámbar</option>
      <option value="avellana">Avellana</option>
      <option value="verde">Verde</option>
      <option value="azul">Azul</option>
      <option value="gris">Gris</option>
      <option value="violeta">Violeta</option>
      <option value="rojo">Rojo</option>
    </select>
  </label>
  <label>Días de vacaciones por año: <input type="number" formControlName="diasVacacionesAnuales"></label>
  <button type="submit">Registrarse</button>
</form>

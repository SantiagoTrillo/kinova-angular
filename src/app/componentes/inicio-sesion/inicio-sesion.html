<main>
  <div class="titulo"><h2>Inicio de sesión</h2></div>
  <section>
    <form [formGroup]="formularioInicioSesion" (ngSubmit)="iniciarSesion()">
      <label>Correo electrónico: <input type="email" formControlName="correo_electronico"></label>
      <label>Contraseña: <input type="password" formControlName="contrasenia"></label>
      <button type="submit">Iniciar sesión</button>
    </form>
  </section>
</main>

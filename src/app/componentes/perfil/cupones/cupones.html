@if (cuponesDisponibles().length > 0) {
  <section>
    <h2>Cupones disponibles</h2>
    <ul>
      @for (cupon of cuponesDisponibles(); track cupon.id) {
        <label>{{ cupon.nombre }}<li [class.registro]="cupon.id === 1">{{ cupon.descuento * 100 }}% de descuento</li></label>
      }
    </ul>
  </section>
}

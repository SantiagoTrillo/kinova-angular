<div>
  <img
    width="270"
    height="405"
    ngSrc="{{ pelicula().imagen }}"
    alt="Póster de una película"
    (error)="pelicula().imagen = 'poster-no-encontrado.jpg'"
  >
  <div>
    <h3>{{ pelicula().titulo }}</h3>
    <span>{{ formatearDuracion(pelicula().duracion) }}</span>
  </div>
</div>

<div class="contenedor-formulario">
  <h3>Modificar Película</h3>
  <form [formGroup]="formularioPelicula" (ngSubmit)="guardarCambios()">
    <div class="columnas-formulario">
      <div class="columna izquierda">
        <label>Título: <input type="text" formControlName="titulo"></label>
        <label>Sinopsis: <textarea formControlName="sinopsis" rows="3"></textarea></label>
        <label>Géneros: <input type="text" formControlName="generos"></label>
      </div>
      <div class="columna derecha">
        <label>Duración: <input type="number" formControlName="duracion"></label>
        <label>
          Restricción de edad:
          <select formControlName="restriccion_edad">
            <option value="ATP">ATP</option>
            <option value="+13">+13</option>
            <option value="+18">+18</option>
          </select>
        </label>
        <label>
          Fecha de estreno:
          <app-selector-fecha
            [fechaInicial]="formularioPelicula.get('fecha_estreno')?.value"
            (fechaSeleccionada)="formularioPelicula.patchValue({ fecha_estreno: $event })"
          />
        </label>
        <label class="fila">
          <span>Disponible:</span>
          <input type="checkbox" formControlName="disponible">
        </label>
      </div>
      <label class="ancho-completo">URL del póster: <input type="text" formControlName="imagen"></label>
    </div>
    <div class="botones">
      <button type="submit">Guardar cambios</button>
      <button type="button" class="cancelar" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>

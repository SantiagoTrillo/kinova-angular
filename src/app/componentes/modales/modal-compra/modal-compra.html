<div class="contenedor-modal">
  <div class="modal">
    <div class="cabecera-modal">
      <h2>Revisión de la compra</h2>
      <button (click)="cerrarModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="detalles-modal">
      <label>{{ etiquetaElementos() }}: <span>{{ elementos() }}</span></label>
      <label>Total: <span>{{ metodoPago() === 'pesos' ? (calcularTotal() | currency: 'ARS': '$ ': '1.0-0') : (calcularTotal().toLocaleString("es-AR") + " puntos") }}</span></label>
      @if (sesionService.usuarioActual()) {
        @if (cuponesUsuario().length > 0) {
          <label
            class="descuento"
            [class.visible]="cuponSeleccionado() && metodoPago() === 'pesos'"
          >Cupón aplicado:
            <span>
            - {{ calcularMontoDescontado() | currency: 'ARS': '$ ': '1.0-0' }}
          </span></label>
        }
        @if (creditoUsuario() > 0) {
          <label class="descuento" [class.visible]="usarCredito() && calcularCreditoAplicado() > 0">
            Crédito aplicado:<span>
            - {{ metodoPago() === 'pesos' ? (calcularCreditoAplicado() | currency: 'ARS': '$ ': '1.0-0') : (calcularCreditoAplicado().toLocaleString("es-AR") + " pts") }}
          </span>
          </label>
          <div class="opcion-credito">
            <span>Usar crédito disponible ({{ creditoUsuario() | currency: 'ARS': '$ ': '1.0-0' }})</span>
            <input type="checkbox" [checked]="usarCredito()" (change)="alternarUsarCredito()">
          </div>
        }
        <div>
          <select #selectorMetodo (change)="seleccionarMetodoPago(selectorMetodo.value)">
            <option value="pesos">Pesos</option>
            <option value="puntos">Puntos</option>
          </select>
          <select
            #selectorCupon
            [class.registro]="cuponSeleccionado()?.id === 1"
            [disabled]="metodoPago() === 'puntos' || cuponesUsuario().length === 0"
            (change)="cambiarCupon(selectorCupon.value)"
          >
            <option value="">Sin cupón</option>
            @for (cupon of cuponesUsuario(); track cupon.id) {
              <option value="{{ cupon.id }}">{{ cupon.nombre }} ({{ cupon.descuento * 100 }}%)</option>
            }
          </select>
        </div>
      }
      <button (click)="confirmarCompra()">Finalizar compra</button>
    </div>
  </div>
</div>
@if (mostrarModalConfirmacion()) {
  <app-modal-confirmacion
    [mensaje]="'El cupón de registro solo es válido para la primera compra. Al finalizar esta compra el cupón quedará inválido.'"
    (confirmar)="ejecutarConfirmacion()"
    (cancelar)="mostrarModalConfirmacion.set(false)"
  />
}
